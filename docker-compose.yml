# docker compose up --build   ->  UI at http://localhost:8501, traces at http://localhost:6006
name: hdb-advisor

services:
  app:
    build: .
    image: hdb-advisor:latest
    ports:
      - "127.0.0.1:8501:8501"   # local machine only
    env_file:
      - path: .env          # GOOGLE_API_KEY, ONEMAP_EMAIL, ONEMAP_PASSWORD (never baked into the image)
        required: false
    environment:
      PHOENIX_TRACING: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_PUBLIC_URL: http://localhost:6006
    volumes:
      - ./data:/app/data    # transaction snapshot, route cache, rules index, checkpoints, preferences
      - ./logs:/app/logs    # per-node JSON run log
    depends_on:
      - phoenix
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-22.0.1
    ports:
      - "127.0.0.1:6006:6006"   # local machine only
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # The image enables login by default. Traces stay on localhost, so the demo runs without accounts.
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix-data:
