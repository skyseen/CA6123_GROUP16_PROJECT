# EHG tiers were cross-checked with HDB's worked examples (S$3,000 -> S$95,000; S$4,200 and S$4,400 -> S$70,000).
verified_on: '2026-11-24'
sources:
  family: https://www.hdb.gov.sg/buying-a-flat/flat-grant-and-loan-eligibility/couples-and-families/cpf-housing-grants
  ehg: https://www.hdb.gov.sg/buying-a-flat/flat-grant-and-loan-eligibility/couples-and-families/enhanced-cpf-housing-grant
  ehg_table: https://www.hdb.gov.sg/-/media/buying-a-flat/flat-grant-and-loan-eligibility/couples-and-families/enhanced-cpf-housing-grant/EHG-amount-Families.pdf
